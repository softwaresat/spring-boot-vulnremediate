name: Harness CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --retries 5 --timeout 60 --upgrade pip setuptools wheel
      - run: python -m pip install --retries 5 --timeout 60 langgraph pytest ruff
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m unittest discover -s tests -v
      - run: ruff check vulnremediate tests --select F,E9
