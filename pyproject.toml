[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnremediate"
version = "0.1.0"
description = "LangGraph harness for repository vulnerability remediation"
requires-python = ">=3.11"
dependencies = ["langgraph>=0.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
vulnremediate = "vulnremediate.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["vulnremediate*"]
